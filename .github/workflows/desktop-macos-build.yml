# The Mac build itself, run by desktop-macos.yml: on Apple silicon first, and on an Intel Mac when no
# Apple silicon machine could be had (both make the same universal app). See desktop-macos.yml for what it makes.
name: Desktop (macOS) build

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      tag:
        description: Release tag to attach the DMG to; empty = build only
        type: string
        default: ''

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    env:
      TAG: ${{ inputs.tag }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci

      - name: Build
        id: build
        run: |
          # A release builds with its own version (v0.12.1 → 0.12.1); otherwise tauri.conf.json's.
          if [ -n "$TAG" ]; then version="${TAG#v}"; else version=$(node -p "require('./src-tauri/tauri.conf.json').version"); fi
          npm run build:mac -- --config "{\"version\":\"$version\"}"
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          out="jukebox-$version-macos.dmg"
          update="jukebox-$version-macos.app.tar.gz"
          mv $bundle/dmg/*.dmg "$out"
          mv $bundle/macos/*.app.tar.gz "$update"
          # The updater's manifest: one universal build serves both kinds of Mac.
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/$update"
          VERSION="$version" URL="$url" SIG="$(cat $bundle/macos/*.app.tar.gz.sig)" node -e '
            const { VERSION, URL, SIG } = process.env
            const build = { signature: SIG, url: URL }
            const manifest = { version: VERSION, pub_date: new Date().toISOString(),
              platforms: { "darwin-aarch64": build, "darwin-x86_64": build } }
            require("fs").writeFileSync("latest-macos.json", JSON.stringify(manifest, null, 2))'
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "update=$update" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Jukebox-macos-${{ inputs.runner }}
          path: desktop/${{ steps.build.outputs.file }}

      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.build.outputs.file }}" "${{ steps.build.outputs.update }}" latest-macos.json --clobber

      - name: Point mac-latest at this build
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mac-latest >/dev/null 2>&1 || gh release create mac-latest --prerelease --latest=false \
            --title "Mac app updates" --notes "Where installed Mac apps look for updates: the newest Mac build's latest-macos.json. To download Jukebox, see the latest release."
          # Only forward: rebuilding an older release must not hide a newer one.
          current=$(gh release download mac-latest -p latest-macos.json -O - 2>/dev/null | node -pe 'JSON.parse(require("fs").readFileSync(0)).version' 2>/dev/null || echo 0.0.0)
          newer=$(CURRENT="$current" NEW="$(node -pe 'require("./latest-macos.json").version')" node -pe '
            const [a, b] = [process.env.NEW, process.env.CURRENT].map(v => v.split(".").map(Number));
            a.some((x, i) => x !== (b[i] || 0)) && a.find((x, i) => x !== (b[i] || 0)) > b[a.findIndex((x, i) => x !== (b[i] || 0))] ? "yes" : "no"')
          if [ "$newer" = "yes" ]; then gh release upload mac-latest latest-macos.json --clobber; else echo "mac-latest has $current already"; fi
