services:
  jukebox:
    build: .
    container_name: jukebox
    env_file: .env
    # Runs as your own user (not root); data/ and secrets/ must belong to it. Set PUID/PGID in .env if yours isn't 1000.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - DB_PATH=/data/jukebox.db
      - FIREBASE_KEY_FILE=/secrets/firebase-key.json
      - FIREBASE_APP_CONFIG=/secrets/google-services.json
      - NAVIDROME_DB=/navidrome/navidrome.db
      - FEATURES_DB=/features/features.db
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro  # optional Firebase files for push notifications; never commit them
      # Optional, for mixes by Isai Pettai: Navidrome's data folder and the audio analyzer's (both read-only).
      - ${NAVIDROME_DATA:-./no-navidrome-data}:/navidrome:ro
      - ${FEATURES_FOLDER:-./no-features}:/features:ro
    ports:
      - "127.0.0.1:8095:8095"  # only this machine; put HTTPS (reverse proxy or tunnel) in front
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets the container reach Navidrome on the host
    restart: unless-stopped
