<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jukebox</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #121212; color: #fff;
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    form { width: min(420px, 100% - 32px); display: grid; gap: 12px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    p { margin: 0; color: #b3b3b3; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid #3a3a3a;
      background: #1e1e1e; color: #fff; font: inherit;
    }
    input:focus { outline: 2px solid #ffb547; border-color: transparent; }
    button {
      padding: 12px; border: 0; border-radius: 999px; background: #ffb547; color: #000;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .error { color: #ff7a7a; min-height: 1.4em; }
  </style>
</head>
<body>
  <!-- The app is the Jukebox website in a window. This page only picks which server to open,
       remembers it, and sends the window there. Server › Change Server… brings you back here. -->
  <form id="form" hidden>
    <h1>Jukebox</h1>
    <p>Your Jukebox server's address.</p>
    <input id="address" type="url" required autocomplete="url" spellcheck="false" />
    <button id="open">Open</button>
    <div class="error" id="error"></div>
  </form>
  <script>
    const KEY = 'jukebox.server'
    const DEFAULT = 'https://jukebox.craftingtable.cc'
    const read = () => { try { return localStorage.getItem(KEY) } catch { return null } }
    const save = (v) => { try { localStorage.setItem(KEY, v) } catch {} }

    const saved = read()
    const changing = new URLSearchParams(location.search).has('change')
    if (saved && !changing) {
      location.replace(saved)
    } else {
      const form = document.getElementById('form')
      const address = document.getElementById('address')
      const error = document.getElementById('error')
      const open = document.getElementById('open')
      address.value = saved ?? DEFAULT
      form.hidden = false
      address.focus()

      form.addEventListener('submit', async (e) => {
        e.preventDefault()
        error.textContent = ''
        let url
        try {
          url = new URL(address.value.trim())
          if (!/^https?:$/.test(url.protocol)) throw new Error()
        } catch {
          error.textContent = 'That isn’t a web address (https://…).'
          return
        }
        const server = url.origin
        open.disabled = true
        try {
          // The server doesn't send CORS headers to this page, so this only tells us it answers.
          await fetch(server + '/health', { mode: 'no-cors', cache: 'no-store' })
        } catch {
          error.textContent = 'Couldn’t reach ' + server + '.'
          open.disabled = false
          return
        }
        save(server)
        location.replace(server)
      })
    }
  </script>
</body>
</html>
