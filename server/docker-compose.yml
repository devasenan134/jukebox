services:
  jukebox:
    build:
      context: ..          # the repository: the image holds the server and the web app
      dockerfile: Dockerfile
    container_name: jukebox
    env_file: .env
    # Runs as your own user (not root); data/ and secrets/ must belong to it. Set PUID/PGID in .env if yours isn't 1000.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - DB_PATH=/data/jukebox.db
      - REQUESTS_DIR=/requests
      - FIREBASE_KEY_FILE=/secrets/firebase-key.json
      - FIREBASE_APP_CONFIG=/secrets/google-services.json
      - FEATURES_DB=/features/features.db
      - SAAVN_ID_MAP=/signals/songs.csv
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro  # optional Firebase files for push notifications; never commit them
      # Optional: the audio analyzer's data folder (read-only), for moods and sound-alike radio.
      - ${FEATURES_FOLDER:-./no-features}:/features:ro
      # Your music folder, read-only. LIBRARIES in .env says what's in it (as seen inside the container,
      # under /music).
      - ${MUSIC_FOLDER:-./no-music}:/music:ro
      # Optional: the folder holding more libraries (one per language: /library/malayalam…), named in LIBRARIES.
      - ${LIBRARY_ROOT:-./no-library}:/library:ro
      # Optional: where scripts/requests/fulfil.py leaves downloads for an admin to check (read-only here).
      - ${REQUESTS_FOLDER:-./no-requests}:/requests:ro
      - ${SIGNALS_FOLDER:-./no-signals}:/signals:ro  # optional: songs.csv with JioSaavn ids for files
    ports:
      - "127.0.0.1:${HOST_PORT:-8095}:8095"  # only this machine; put HTTPS (reverse proxy or tunnel) in front
    mem_limit: ${MEM_LIMIT:-1g}
    restart: unless-stopped
